[package]
name = "omega-seek"
version = "0.1.9"
edition = "2024"
rust-version = "1.88.0"
description = "Code search for coding agents, over MCP: the right lines, not a chain of greps"
repository = "https://github.com/gyxoBka/omega-seek"
license = "MIT"
publish = false

# The package is omega-seek; the command and the crate are omega.
[lib]
name = "omega"

[[bin]]
name = "omega"
path = "src/main.rs"

[dependencies]
ignore = "0.4"
inquire = "0.7"
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rust-stemmers = "1.2"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
ureq = "3"
model2vec-rs = { version = "0.2.1", default-features = false, features = ["onig", "local-only"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
